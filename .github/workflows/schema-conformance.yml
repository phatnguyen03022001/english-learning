name: English Learning — Dictionary Quality Gates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/schema-conformance.yml"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - "AGENTS.md"
      - "README.md"
      - ".agents/**"
      - ".codex/**"
      - "third_party/ecc/**"
      - "scripts/**"
      - "schemas/v1/**"
      - "validators/**"
      - "pipeline/**"
      - "schemas/v2/**"
      - "tests/production/**"
      - "tests/fixtures/production/**"
      - "docs/lexical-production-contract.md"
      - "docs/evidence-provenance-contract.md"
      - "docs/editorial-workflow.md"
      - "docs/schema-migration.md"
      - "docs/production-readiness.md"
      - "tests/schema-conformance.test.mjs"
      - "tests/graph-integrity.test.mjs"
      - "tests/fixtures/schema/v1/**"
      - "tests/fixtures/graph/v1/**"
      - "tests/pilot-fixtures.test.mjs"
      - "tests/fixtures/pilot/v1/**"
      - "tests/stress/**"
      - "docs/quality-stress-audit.md"
      - "data/candidates/**"
      - "data/reviews/**"
      - "docs/lexical-fanout-pilot-report.md"
      - "docs/phase8-lexicographic-quality-review.md"
      - "docs/phase9-lexical-remediation.md"
      - "docs/phase10-editorial-review-packet.md"
      - "docs/phase11-closure.md"

permissions:
  contents: read

concurrency:
  group: dictionary-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-and-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v7
      - name: Use Node.js 26 LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit locked dependencies
        run: npm audit --audit-level=moderate
      - name: Run schema, graph, production, stress and Node.js 26 coverage gates
        run: npm test
      - name: Validate Phase 7 candidate batch
        run: |
          set -euo pipefail
          input_path="data/candidates/pilot-fanout-001.json"
          state_path="${RUNNER_TEMP}/phase7-candidate-state.json"
          output_path="${RUNNER_TEMP}/phase7-candidate-validation.json"
          before_sha="$(sha256sum "$input_path" | awk '{print $1}')"
          npm --silent run candidates:validate -- --input "$input_path" --state "$state_path" > "$output_path"
          VALIDATION_OUTPUT="$output_path" VALIDATION_INPUT="$input_path" VALIDATION_STATE="$state_path" BEFORE_SHA="$before_sha" node --input-type=module <<'NODE'
          import {existsSync, readFileSync} from "node:fs";
          import {createHash} from "node:crypto";

          const outputPath = process.env.VALIDATION_OUTPUT;
          const inputPath = process.env.VALIDATION_INPUT;
          const statePath = process.env.VALIDATION_STATE;
          const result = JSON.parse(readFileSync(outputPath, "utf8"));
          const afterSha = createHash("sha256").update(readFileSync(inputPath)).digest("hex");
          const expected = {
            status: "dry-run",
            issues: 0,
            publicationEligible: false,
            stateCreated: false,
            inputUnchanged: process.env.BEFORE_SHA === afterSha
          };
          if (result.status !== expected.status) throw new Error(`Unexpected status: ${result.status}`);
          if (!Array.isArray(result.issues) || result.issues.length !== expected.issues)
            throw new Error(`Unexpected issues: ${JSON.stringify(result.issues)}`);
          if (result.publicationEligible !== expected.publicationEligible)
            throw new Error(`Publication eligibility was ${result.publicationEligible}`);
          if (existsSync(statePath) !== expected.stateCreated)
            throw new Error(`Validation created state at ${statePath}`);
          if (!expected.inputUnchanged) throw new Error("Candidate input changed during validation");
          console.log(JSON.stringify({
            status: result.status,
            issues: result.issues.length,
            publicationEligible: result.publicationEligible,
            stateCreated: existsSync(statePath),
            inputUnchanged: expected.inputUnchanged
          }));
          NODE

      - name: Validate Phase 9 corrected candidate batch
        run: |
          set -euo pipefail
          input_path="data/candidates/pilot-fanout-002.json"
          state_path="${RUNNER_TEMP}/phase9-candidate-state.json"
          output_path="${RUNNER_TEMP}/phase9-candidate-validation.json"
          before_sha="$(sha256sum "$input_path" | awk '{print $1}')"
          npm --silent run candidates:validate -- --input "$input_path" --state "$state_path" > "$output_path"
          VALIDATION_OUTPUT="$output_path" VALIDATION_INPUT="$input_path" VALIDATION_STATE="$state_path" BEFORE_SHA="$before_sha" node --input-type=module <<'NODE'
          import {existsSync, readFileSync} from "node:fs";
          import {createHash} from "node:crypto";

          const outputPath = process.env.VALIDATION_OUTPUT;
          const inputPath = process.env.VALIDATION_INPUT;
          const statePath = process.env.VALIDATION_STATE;
          const result = JSON.parse(readFileSync(outputPath, "utf8"));
          const afterSha = createHash("sha256").update(readFileSync(inputPath)).digest("hex");
          const inputUnchanged = process.env.BEFORE_SHA === afterSha;
          if (result.status !== "dry-run") throw new Error(`Unexpected status: ${result.status}`);
          if (result.batchId !== "pilot-fanout-002") throw new Error(`Unexpected batch: ${result.batchId}`);
          if (!Array.isArray(result.issues) || result.issues.length !== 0)
            throw new Error(`Unexpected issues: ${JSON.stringify(result.issues)}`);
          if (result.publicationEligible !== false) throw new Error("Publication eligibility was not false");
          if (existsSync(statePath)) throw new Error(`Validation created state at ${statePath}`);
          if (!inputUnchanged) throw new Error("Candidate input changed during validation");
          console.log(JSON.stringify({
            status: result.status,
            batchId: result.batchId,
            issues: result.issues.length,
            publicationEligible: result.publicationEligible,
            stateCreated: existsSync(statePath),
            inputUnchanged
          }));
          NODE

      - name: Validate current Phase 13 candidate batches
        run: |
          set -euo pipefail
          npm run candidates:validate -- --input data/candidates/pilot-fanout-003.json
          npm run candidates:validate -- --input data/candidates/phase13-source-audit-001.json
