name: Phase 2–6 Dictionary Quality & Integrity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/schema-conformance.yml"
      - "package.json"
      - "scripts/generate-schemas.mjs"
      - "scripts/generate-schemas-v2.mjs"
      - "schemas/v1/**"
      - "validators/**"
      - "pipeline/**"
      - "schemas/v2/**"
      - "tests/production/**"
      - "tests/fixtures/production/**"
      - "docs/lexical-production-contract.md"
      - "tests/schema-conformance.test.mjs"
      - "tests/graph-integrity.test.mjs"
      - "tests/fixtures/schema/v1/**"
      - "tests/fixtures/graph/v1/**"
      - "tests/pilot-fixtures.test.mjs"
      - "tests/fixtures/pilot/v1/**"
      - "tests/stress/**"
      - "docs/quality-stress-audit.md"

permissions:
  contents: read

concurrency:
  group: dictionary-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-and-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Ajv
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Run schema, graph, pilot and adversarial stress tests
        run: npm test
